<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 0 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    /* Dynamic feedback styling */
    .error-message {
      color: #d9534f;
      font-weight: bold;
      margin-top: 15px;
    }
    .success-message {
      color: #5cb85c;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2>House Price Input Form</h2>

  <!-- 1. Form Element (Fixes the null listener error) -->
  <form id="houseForm">
    <div class="form-group">
      <label for="location">Location:</label>
      <input type="text" id="location" name="location">
    </div>

    <div class="form-group">
      <label for="price">Price ($):</label>
      <input type="number" id="price" name="price">
    </div>

    <div class="form-group">
      <label for="bedrooms">Bedrooms:</label>
      <input type="number" id="bedrooms" name="bedrooms">
    </div>

    <button type="submit">Submit</button>

    <div id="feedbackContainer"></div>

    <script src="w3.js"></script>
  </form>
